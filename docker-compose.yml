version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: thakare-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: thakare-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever is in .env so the backend always talks to the
      # mongodb container when running via docker-compose.
      - MONGODB_URI=mongodb://mongodb:27017/thakare-ecom
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://localhost:4000"
        VITE_RAZORPAY_KEY_ID: "${VITE_RAZORPAY_KEY_ID:-}"
    container_name: thakare-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: "http://localhost:4000"
    container_name: thakare-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
